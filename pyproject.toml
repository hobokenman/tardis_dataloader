[project]
name = "tardis-dataloader"
version = "0.1.0"
description = "Load tardis.dev-format market data files into ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.11.0",
    "python-dotenv>=1.2.4",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
tardis-load = "tardis_dataloader.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*"]
follow_untyped_imports = true
